### Note: DO NOT use quantized model or quantization_bit when merging lora adapters
### NOTE: gpt-oss is always dequantized from MXFP4 to bf16 on load (~234GB for the 120B checkpoint).
### export_device: cpu requires a host with enough RAM to hold that; export_device: auto spreads the
### merge across the 4x H200 instead, which is usually the safer choice for this model size.

### model
model_name_or_path: openai/gpt-oss-120b
adapter_name_or_path: saves/gpt-oss-120b/lora/pretrain
template: gpt_oss
trust_remote_code: true

### export
export_dir: saves/gpt-oss-120b/pt_merged
export_size: 5
export_device: auto  # choices: [cpu, auto]
export_legacy_format: false
