### model
# Continue from the merged output of the SFT stage (see examples/merge_lora/gpt_oss_20b_merge_sft.yaml).
model_name_or_path: saves/gpt-oss-20b/sft_merged
template: gpt_oss
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid  # choices: [sigmoid (dpo), orpo, simpo] — switch stage: kto + an unpaired kto_* dataset for KTO instead
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# TODO: replace with the actual preference dataset.
dataset: dpo_en_demo
cutoff_len: 2048
max_samples: 20000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/gpt-oss-20b/lora/dpo
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

