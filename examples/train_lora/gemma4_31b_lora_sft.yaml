### model
# Continue from the merged output of the PT stage (see examples/merge_lora/gemma4_31b_merge_pretrain.yaml).
# If skipping continued pretraining, point this at google/gemma-4-31B-it instead.
model_name_or_path: saves/gemma4-31b/pt_merged
template: gemma4
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# TODO: replace with the actual instruction dataset.
# gemma4 uses ReasoningTemplate (thought_words) — if the goal is to keep the "Thinking" (CoT) behavior,
# the SFT data should contain reasoning traces in the same <think>...</think>-equivalent format,
# otherwise SFT on non-reasoning data can suppress the model's native chain-of-thought.
dataset: identity,alpaca_en_demo
cutoff_len: 4096
max_samples: 20000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/gemma4-31b/lora/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

